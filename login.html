<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk - Sistem Antrian</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-wrap">
    <div class="login-card">
      <h1>Masuk</h1>
      <p class="muted">Halaman ini untuk mengakses Dashboard Admin dan Panel Operator. Layar Kiosk tidak memerlukan login.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="Contoh: emilys" autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password">
        </div>
        <div id="login-error" class="form-error" role="alert" hidden></div>
        <button id="submit-btn" class="btn btn-primary" type="submit">Masuk</button>
      </form>

      <p class="hint">Gunakan akun uji dari <a href="https://dummyjson.com/users" target="_blank" rel="noopener">dummyjson.com/users</a> (contoh username/password tercantum di sana).</p>
    </div>
  </main>

  <script src="dist/shared.js" defer></script>
  <script src="dist/login.js" defer></script>
</body>
</html>
